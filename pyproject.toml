[project]
name = "docx-blocks"
version = "0.1.0"
description = "Редактирование .docx через текстовый блочный формат"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
doc-cli = "doc_cli:main"
doc-editor = "doc_editor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docx_blocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]